default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  host: localhost
  database: book_collection_development
  username: <%= ENV["DATABASE_USER"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

test:
  <<: *default
  host: localhost
  database: book_collection_test
  username: <%= ENV["DATABASE_USER"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>

  cache:
    <<: *primary_production
    database: book_collection_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: book_collection_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: book_collection_production_cable
    migrations_paths: db/cable_migrate